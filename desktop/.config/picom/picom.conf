# Subtle window rounding for i3. Picom 13+.
backend = "glx";
vsync = true;
shadow = false;
fading = false;
# Keep rounding modest: i3 pixel borders are clipped, not redrawn by Picom.
corner-radius = 6;

# Keep bars and full-screen apps square; Rofi and Dunst draw their own rounded borders.
rules: ({
    match = "window_type = 'dock' || window_type = 'desktop' || fullscreen || class_g = 'Rofi' || class_g = 'Dunst'";
    corner-radius = 0;
}, {
    match = "window_type = 'normal' && class_g != 'Rofi' && class_g != 'Dunst'";
    # Retain outgoing workspace contents for 16ms, then remove in one step.
    # Mitigates wallpaper exposure between X11 unmap/map events (picom #16).
    # Picom 13 animation syntax; no interpolated fade or movement.
    animations = ({
        triggers = [ "hide" ];
        opacity = {
            curve = "steps(1, jump-end)";
            duration = 0.016;
            start = "window-raw-opacity-before";
            end = 0;
        };
    });
});
