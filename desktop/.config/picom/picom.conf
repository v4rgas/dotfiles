# Subtle window rounding for i3. Picom 13+.
backend = "glx";
vsync = true;
shadow = false;
fading = false;
corner-radius = 6;

# Keep bars and full-screen apps square; Rofi draws its own rounded border.
rules: ({
    match = "window_type = 'dock' || window_type = 'desktop' || fullscreen || class_g = 'Rofi'";
    corner-radius = 0;
});
