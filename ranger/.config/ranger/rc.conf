# Loaded on top of ranger's default rc.conf.

# yc: copy the selected files (or the one under the cursor) to the system
#     clipboard. One image goes on as the image, so Ctrl+V in Discord uploads
#     it; anything else as file links, like PCManFM.
map yc shell ~/.config/ranger/scripts/clip-files.sh %p
# yD: drag the selected files into Discord or any other window (ripdrag).
map yD shell -f ripdrag --and-exit --all %p
