# Compact text status line; original configs: ~/.local/state/i3-bar-backups/
separator=true
separator_block_width=16
markup=pango

[disk]
label=<span>/ </span>
instance=/
command=~/.config/i3/scripts/disk
interval=30

[volume-pulseaudio]
label=<span>VOL </span>
command=~/.config/i3/scripts/volume
instance=Master
interval=2
signal=1

[memory]
label=<span>RAM </span>
command=if [ "$BLOCK_BUTTON" = 1 ]; then i3-msg -q 'exec --no-startup-id ghostty -e htop'; fi; ~/.config/i3/scripts/memory
interval=5

[cpu_usage]
label=<span>CPU </span>
command=if [ "$BLOCK_BUTTON" = 1 ]; then i3-msg -q 'exec --no-startup-id ghostty -e htop'; fi; ~/.config/i3/scripts/cpu_usage
interval=5

[temperature]
label=<span>TEMP </span>
command=if [ "$BLOCK_BUTTON" = 1 ]; then i3-msg -q 'exec --no-startup-id ghostty -e htop'; fi; ~/.config/i3/scripts/temperature | sed 's/^[^ ]* //; s/\.0°C/°C/'
interval=30

[ppd-status]
command=/usr/bin/python3 /usr/bin/powerprofilesctl get | cut -c1-3
interval=5

[battery]
command=~/.config/i3/scripts/battery
interval=30

[time]
command=date '+%d %b  %H:%M'
interval=10
separator=false
separator_block_width=10
